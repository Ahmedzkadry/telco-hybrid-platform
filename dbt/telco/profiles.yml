telco:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | as_number }}"
      user: "{{ env_var('POSTGRES_USER', 'telco') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'telco123') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'telco') }}"
      schema:  analytics
      threads: 4
